<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Selichot Follow</title>
  <desc id="desc">A gold Hebrew samekh surrounded by light on a midnight blue background.</desc>
  <defs>
    <radialGradient id="bg" cx="31%" cy="22%" r="92%">
      <stop offset="0" stop-color="#18385a"/>
      <stop offset=".48" stop-color="#0c2138"/>
      <stop offset="1" stop-color="#06111e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0b3"/>
      <stop offset=".45" stop-color="#e9bd63"/>
      <stop offset="1" stop-color="#b9782e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
