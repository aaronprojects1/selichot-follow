  </defs>
  <rect width="512" height="512" fill="#06111e"/>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#e9bd63" stroke-opacity=".11" stroke-width="2"/>
  <circle cx="256" cy="256" r="139" fill="#e9bd63" fill-opacity=".055" stroke="#e9bd63" stroke-opacity=".24" stroke-width="3"/>
  <path d="M256 74v38M256 400v38M74 256h38M400 256h38M128 128l27 27M357 357l27 27M384 128l-27 27M155 357l-27 27" stroke="#e9bd63" stroke-linecap="round" stroke-opacity=".34" stroke-width="5"/>
  <text x="256" y="341" text-anchor="middle" fill="url(#gold)" filter="url(#glow)" font-family="Georgia, 'Times New Roman', serif" font-size="246" font-weight="700">ס</text>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
